name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run AI Code Reviewer
        uses: basilevincenzo/ai-code-reviewer@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
